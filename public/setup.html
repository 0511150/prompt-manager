<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>首次设置 · Prompt 工作台</title><link rel="stylesheet" href="/login.css"></head><body><main><div class="brand"><span>Prompt<small>PERSONAL WORKSPACE</small></span></div><section class="login-card"><p class="eyebrow">FIRST-TIME SETUP</p><h1>为你的工作台设置密码。</h1><p class="subtitle">首次部署后设置一次。初始化码是部署时填写的 SETUP_TOKEN；设置完成后，其他访客只能输入访问密码登录。</p><form id="setup-form"><label for="token">初始化码</label><input id="token" name="token" type="password" autocomplete="off" required maxlength="512" placeholder="部署时填写的初始化码"><label for="password" class="setup-label">设置访问密码</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="512" placeholder="至少 12 字符，建议使用随机长口令"><label for="confirm" class="setup-label">再次输入密码</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="512" placeholder="确认访问密码"><p id="error" role="alert" aria-live="polite"></p><button class="submit" type="submit" id="submit">设置密码并进入 →</button></form><div class="security-note"><span class="dot"></span>密码只存储加盐校验结果，不保存明文</div></section><footer>一处工作区，有序安放所有灵感。<span>Cloudflare · R2</span></footer></main><script src="/setup.js" defer></script></body></html>
