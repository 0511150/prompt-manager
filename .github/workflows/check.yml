name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:dev
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - run: npm audit --omit=dev
      - name: Test against the local Workers runtime
        shell: bash
        run: |
          npm run dev > /tmp/prompt-manager-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              npm test
              exit $?
            fi
            sleep 1
          done
          cat /tmp/prompt-manager-dev.log
          exit 1
